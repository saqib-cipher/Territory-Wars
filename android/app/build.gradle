plugins {
    id 'com.android.application'
}

android {
    namespace 'com.territorywars'
    compileSdk 35

    defaultConfig {
        applicationId "com.territorywars"
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        // Server / Firebase endpoints read from Gradle properties.
        buildConfigField "String", "API_BASE_URL", "\"${project.properties['tw.apiBaseUrl'] ?: 'https://api.territorywars.example/v1'}\""
        buildConfigField "String", "SOCKET_URL", "\"${project.properties['tw.socketUrl'] ?: 'https://api.territorywars.example'}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            buildConfigField "String", "API_BASE_URL", "\"${project.properties['tw.apiBaseUrlRelease'] ?: 'https://api.territorywars.example/v1'}\""
            buildConfigField "String", "SOCKET_URL", "\"${project.properties['tw.socketUrlRelease'] ?: 'https://api.territorywars.example'}\""
        }
        debug {
            // Firebase emulators / local dev server.
            buildConfigField "String", "API_BASE_URL", "\"${project.properties['tw.apiBaseUrlDebug'] ?: 'http://10.0.2.2:8080/v1'}\""
            buildConfigField "String", "SOCKET_URL", "\"${project.properties['tw.socketUrlDebug'] ?: 'http://10.0.2.2:8080'}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core:1.13.1'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.activity:activity:1.9.1'
    implementation 'androidx.fragment:fragment:1.8.2'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.8.4'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.8.4'

    // Material 3 Expressive
    implementation 'com.google.android.material:material:1.12.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.7.7'
    implementation 'androidx.navigation:navigation-ui:2.7.7'

    // ConstraintLayout + RecyclerView
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room (local db)
    implementation 'androidx.room:room-runtime:2.6.1'
    annotationProcessor 'androidx.room:room-compiler:2.6.1'

    // DataStore (preferences / cloud-save cache)
    implementation 'androidx.datastore:datastore-preferences:1.1.1'

    // Encrypted preferences
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:2.11.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.11.0'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:4.12.0'
    implementation 'io.socket:socket.io-client:2.1.0'

    // Ads + Billing
    implementation 'com.google.android.gms:play-services-ads:23.2.0'
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.android.billingclient:billing:7.0.0'

    // Firebase Auth (optional auth provider)
    implementation platform('com.google.firebase:firebase-bom:33.1.2')
    implementation 'com.google.firebase:firebase-auth'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}
