plugins {
    id 'com.android.application'
    id 'com.google.gms.google-services'
}

android {
    namespace 'glab.guesscard'
    compileSdk 37

    defaultConfig {
        applicationId "glab.guesscard"
        minSdk 24
        targetSdk 37
        versionCode 1
        versionName "1.0.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"

        buildConfigField "String", "SOCKET_URL", "\"${project.properties['gc.socketUrl'] ?: 'https://territory-wars-9o4f.onrender.com'}\""
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            buildConfigField "String", "SOCKET_URL", "\"${project.properties['gc.socketUrlRelease'] ?: 'https://territory-wars-9o4f.onrender.com'}\""
        }
        debug {
            buildConfigField "String", "SOCKET_URL", "\"${project.properties['gc.socketUrlDebug'] ?: 'http://10.0.2.2:8080'}\""
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

    lint {
        abortOnError false
        checkReleaseBuilds false
    }
}

dependencies {
    // Core
    implementation 'androidx.core:core:1.19.0'
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.activity:activity:1.13.0'
    implementation 'androidx.fragment:fragment:1.8.9'
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-runtime:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-viewmodel-savedstate:2.11.0'

    // Material 3
    implementation 'com.google.android.material:material:1.14.0'

    // Navigation
    implementation 'androidx.navigation:navigation-fragment:2.9.8'
    implementation 'androidx.navigation:navigation-ui:2.9.8'

    // Layouts
    implementation 'androidx.constraintlayout:constraintlayout:2.2.2'
    implementation 'androidx.recyclerview:recyclerview:1.4.0'
    implementation 'androidx.cardview:cardview:1.0.0'

    // Room (local db)
    implementation 'androidx.room:room-runtime:2.8.4'
    annotationProcessor 'androidx.room:room-compiler:2.8.4'

    // DataStore
    implementation 'androidx.datastore:datastore-preferences:1.2.1'

    // Encrypted preferences
    implementation 'androidx.security:security-crypto:1.1.0'

    // Networking
    implementation 'com.squareup.retrofit2:retrofit:3.0.0'
    implementation 'com.squareup.retrofit2:converter-gson:3.0.0'
    implementation 'com.squareup.okhttp3:okhttp:5.4.0'
    implementation 'com.squareup.okhttp3:logging-interceptor:5.4.0'
    implementation 'io.socket:socket.io-client:2.1.2'

    // Google Sign-In + Ads
    implementation 'com.google.android.gms:play-services-auth:21.6.0'
    implementation 'com.google.android.gms:play-services-ads:25.4.0'
    implementation 'com.android.billingclient:billing:9.1.0'

    // Firebase (single BOM, no duplicates)
    implementation platform('com.google.firebase:firebase-bom:34.17.0')
    implementation 'com.google.firebase:firebase-auth'
    implementation 'com.google.firebase:firebase-database'
    implementation 'com.google.firebase:firebase-analytics'

    // Image loading
    implementation 'com.github.bumptech.glide:glide:5.0.9'
    annotationProcessor 'com.github.bumptech.glide:compiler:5.0.9'

    // Testing
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}
